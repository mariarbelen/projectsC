name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CXX=${{ matrix.compiler }}
      - name: Run tests
        run: make test
